services:
  nginx:
    image: nginx:alpine
    container_name: php2shell-nginx
    ports:
      - "8888:80"
      - "8889:81"
    volumes:
      - ./src:/var/www/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php-fpm
      - php-fpm-patched
    networks:
      - challenge_net

  php-fpm:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: php2shell-fpm
    volumes:
      - ./src:/var/www/html
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - FLAG=FLAG{steal_my_bitcoin_php2shell_local_lab_success}
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      - challenge_net

  php-fpm-patched:
    build:
      context: .
      dockerfile: Dockerfile.php-patched
    container_name: php2shell-fpm-patched
    volumes:
      - ./src:/var/www/html
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    environment:
      - FLAG=FLAG{steal_my_bitcoin_patched_comparison}
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      - challenge_net

networks:
  challenge_net:
    driver: bridge

; PHP configuration for PHP2Shell vulnerability research

; Memory configuration (for CVE-2026-109618 OOM testing)
memory_limit = 128M
post_max_size = 64M
upload_max_filesize = 64M

; Session Upload Progress configuration (for CVE-2026-109619 UAF testing)
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
session.upload_progress.prefix = "upload_progress_"
session.upload_progress.name = "PHP_SESSION_UPLOAD_PROGRESS"
session.upload_progress.freq = "1%"
session.upload_progress.min_freq = "1"
session.save_path = "/tmp"

; Verbose error output for local debugging
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On
error_log = /tmp/php_error.log
